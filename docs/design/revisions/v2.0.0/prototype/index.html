function button(id,label,cls='primary',extra=''){return `<button data-testid="${id}" class="${cls}" ${extra}>${label}</button>`}function header(){return `<header class="top"><div class="brand"><svg viewBox="0 0 40 40"><path d="M7 28V16L20 5L33 16V28L20 36Z" fill="#206258"/><path d="M13 25L20 13L27 25M16 21H24" stroke="#e5e8c2" stroke-width="3" fill="none"/></svg>苔原小队 <span class="tag">MOSS & MIGHT</span></div><div class="top-right"><span class="online">本地交互演示</span><span class="pill">设计提案 v2.0.0</span>${state.screen!=='menu'?button('home','返回营地','ghost'):''}</div></header>`}function footer(){return `<footer class="footer"><span>FIELD NOTES / 001　把小小的默契，变成大大的力量。</span><span>原创视觉 · PROPOSED · 非联网游戏</span></footer>`}function modeName(){return {practice:'单人练习',duel:'好友对决',tournament:'八人远征'}[state.mode]}
function render(){let html='';if(state.screen==='menu')html=`<section class="hero"><div><div class="eyebrow">一场关于伙伴的远征</div><h1>小小伙伴，<br>大有可为。</h1><p>招募森林里的奇妙居民，编排你的五人小队。<br>每一次相遇，都让下一场冒险更有把握。</p><div class="small-label">招募 · 编队 · 自动对战</div></div><div class="landscape"><div class="note">THE WILD IS CALLING ↗</div><div class="hero-beast one">${art(0)}</div><div class="hero-beast two">${art(1)}</div></div></section><div class="section-line"><strong>选择今天的旅程</strong><small>三种玩法，同一份默契</small></div><div class="modes"><button class="mode featured" data-testid="mode-tournament"><span class="number">01 / EXPEDITION</span><span class="arrow">↗</span><h3>八人远征</h3><p>八席同场 · 空席由机器人补齐</p></button><button class="mode" data-testid="mode-duel"><span class="number">02 / FRIENDLY DUEL</span><span class="arrow">↗</span><h3>好友对决</h3><p>邀请一位好友 · 逐轮切磋</p></button><button class="mode" data-testid="mode-practice"><span class="number">03 / PRACTICE</span><span class="arrow">↗</span><h3>单人练习</h3><p>随时出发 · 熟悉小队的节奏</p></button></div>`;
if(state.screen==='lobby')html=`<div class="head-row"><div><div class="eyebrow">集结你的伙伴 / BASE CAMP</div><h2>${modeName()}</h2></div><span class="pill">演示房间 · MOSS-042</span></div><div class="lobby-grid"><div class="room"><div class="board-title">远征席位 <span>${state.invite?'2':'1'} / ${state.mode==='duel'?2:8} 真人</span></div><div class="seats">${Array.from({length:state.mode==='duel'?2:8},(_,i)=>`<div class="seat ${i===0||i===1&&state.invite?'occupied':''}">${i===0?art(0):i===1&&state.invite?art(1):'<span style="font-size:25px;opacity:.35">＋</span>'}<strong>${i===0?'你 · 苔原旅人':i===1&&state.invite?'好友 · 云间来客':'等待伙伴'}</strong><small>${i===0?'房主 · 已就绪':i===1&&state.invite?'已加入 · 已就绪':state.mode==='tournament'?'开始时机器人补位':'邀请好友加入'}</small></div>`).join('')}</div><p class="hint">${state.mode==='tournament'?'你可以独自出发。其余空席将在开局时由机器人补齐。':'两位伙伴都到齐后即可开始。邀请反馈仅在此演示内模拟。'}</p><div class="status" role="status">${state.invite?'云间来客已接受邀请，加入房间。':'房间已创建，等待你的下一步。'}</div></div><aside class="side-panel"><div class="eyebrow">远征约定</div><h3>准备好就出发</h3><div class="rule"><span>阵容容量</span><b>5 名伙伴</b></div><div class="rule"><span>每轮金币</span><b>10 枚</b></div><div class="rule"><span>空席处理</span><b>${state.mode==='duel'?'等待好友':'机器人补齐'}</b></div><p class="hint">${state.mode==='duel'?'好友对决由双方准备后开始。':'每轮配对自动战斗，存活到最后的小队获胜。'}</p>${button('invite-friend',state.invite?'好友已加入 ✓':'邀请好友 ↗','secondary',state.invite?'disabled':'')}${button('start-run','开始远征 →','primary',state.mode==='duel'&&!state.invite?'disabled':'')}<p class="hint">此原型不调用平台邀请或房间服务。</p></aside></div>`;
if(state.screen==='shop')html=shop();if(state.screen==='battle')html=battle();if(state.screen==='result')html=result();document.getElementById('app').innerHTML=header()+`<main class="screen">${html}</main>`+footer();bind()}
function unit(i,where,pos){if(i===null)return `<button class="unit empty ${state.selected?.where===where&&state.selected.pos===pos?'selected':''}" data-testid="${where}-slot-${pos}" aria-label="空阵位 ${pos+1}"><span class="team-index">0${pos+1}</span><strong>＋</strong><div class="hint">放置伙伴</div></button>`;let a=animals[i];return `<button class="unit ${state.selected?.where===where&&state.selected.pos===pos?'selected':''}" data-testid="${where}-slot-${pos}" aria-label="${where==='shop'?'招募':'阵位'} ${pos+1} ${a.name} 攻击${a.atk} 生命${a.hp}">${where==='shop'?'<span class="cost">3</span>':`<span class="team-index">0${pos+1}</span>`}${state.frozen.includes(pos)&&where==='shop'?'<span class="frozen" title="已冻结">❄</span>':''}${art(i)}<h4>${a.name}</h4><div class="power"><span class="attack">⚔ ${a.atk}</span><span class="health">♥ ${a.hp}</span></div></button>`}
function shop(){let sel=state.selected;let idx=sel?(sel.where==='shop'?state.shop:state.team)[sel.pos]:null;let a=idx===null||idx===undefined?null:animals[idx];return `<div class="head-row"><div><div class="eyebrow">${modeName()} / RECRUIT & ARRANGE</div><h2>让默契，慢慢生长。</h2></div><div class="stats"><div class="stat"><label>回合</label><strong>${String(state.round).padStart(2,'0')}</strong></div><div class="stat gold"><label>可用金币</label><strong>${state.gold} <small>◉</small></strong></div><div class="stat"><label>战绩 / 生命</label><strong>${state.wins} <small>⚑ / ${state.lives} ♥</small></strong></div></div></div><div class="shop-layout"><div><section class="board"><div class="board-title">你的小队 <span>← 前排先攻击　·　选择两名伙伴交换位置</span></div><div class="slots">${state.team.map((x,i)=>unit(x,'team',i)).join('')}</div></section><section class="shop-section"><div class="board-title">林间招募站 <span>每名伙伴 3 金币 · 冻结可保留至下回合</span></div><div class="slots">${state.shop.map((x,i)=>unit(x,'shop',i)).join('')}</div></section><div class="bottom-bar">${button('roll-shop','↻ 刷新 · 1 金','secondary',state.gold<1?'disabled':'')}<div class="status" role="status">${state.team.filter(x=>x!==null).length?'小队已集结。调整站位后，准备迎战。':'选择下方伙伴查看技能，开始组建你的小队。'}</div>${button('ready-battle','准备迎战 →','primary',state.team.every(x=>x===null)?'disabled':'')}</div></div><aside class="side-panel"><div class="small-label">伙伴档案 / FIELD GUIDE</div><div class="detail-art">${a?`<span class="tier">TIER 01</span>${art(idx)}`:'<span style="font-size:36px;color:#89a47d">✧</span>'}</div><div class="detail-name"><h3>${a?a.name:'认识一位伙伴'}</h3><span class="small-label">${a?'★☆☆':''}</span></div><div class="small-label">${a?a.en:'SELECT A COMPANION'}</div><div class="skill"><b>${a?a.skill:'每一名伙伴，都有自己的本领。'}</b>${a?a.desc:'点击招募站里的伙伴，查看攻击、生命和技能。'}</div>${a?`<div class="actions">${sel.where==='shop'?button('buy-selected','招募 · 3 金','primary',state.gold<3||state.team.every(x=>x!==null)?'disabled':'')+button('freeze-selected',state.frozen.includes(sel.pos)?'解冻':'❄ 冻结','secondary'):button('sell-selected','送别 · +1 金','secondary')}</div>`:''}<p class="hint">${sel?.where==='team'?'再选一个阵位即可交换。伙伴的技能说明随选择更新。':'点击空阵位可放入选中的招募伙伴；点击「招募」自动放入首个空位。'}</p></aside></div>`}
const events=['双方阵容已锁定，校验回合快照。','战斗开始 · 伙伴技能演示事件确认。','前排交锋 · 伤害按事件序号依次呈现。','伙伴离场 · 触发效果结算完成。','小队反击 · 对手前排生命归零。','战斗结束 · 权威结果已确认。'];function battle(){return `<div class="head-row"><div><div class="eyebrow">回合 ${String(state.round).padStart(2,'0')} / AUTO BATTLE</div><h2>把舞台，交给伙伴。</h2></div><div class="toolbar">${button('battle-speed',`${state.speed}× 速度`,'secondary')}${button('skip-battle',state.battleDone?'已播完':'跳过演出','ghost',state.battleDone?'disabled':'')}</div></div><div class="battle-field"><div class="battle-labels"><b>苔原旅人 · 你</b><b>苔风小队 · 训练对手</b></div><div class="combatants"><div class="squad">${state.team.filter(x=>x!==null).map((x,i)=>`<div class="fighter ${state.event===2&&i===0?'active':''}">${art(x)}<div class="power">${animals[x].atk} ⚔　${Math.max(1,animals[x].hp-(state.event>2?1:0))} ♥</div></div>`).join('')}</div><div class="versus">VS</div><div class="squad enemy">${[2,4,1].map((x,i)=>`<div class="fighter ${state.event>=3+i?'dead':''}">${art(x)}<div class="power">${animals[x].atk} ⚔　${state.event>=3+i?0:animals[x].hp} ♥</div></div>`).join('')}</div></div><div class="protocol">事件演示 FIXTURE-R${state.round} · 仅按确认序号播放 · 非实际战斗计算</div></div><div class="timeline"><div style="flex:1"><div class="small-label">EVENT ${String(state.event+1).padStart(3,'0')} / 006</div><p role="status">${events[state.event]}</p><div class="progress"><i style="width:${(state.event+1)/6*100}%"></i></div></div>${button('battle-result','查看结算 →','primary',!state.battleDone?'disabled':'')}</div><p class="hint">战斗演出无法改变结算。加速与跳过只影响本地事件播放时间。所有胜负均为明确标注的演示数据。</p>`}
function result(){let end=state.round>=3;return `<section class="result"><div class="eyebrow">${end?'远征结束 / EXPEDITION COMPLETE':'回合结算 / ROUND COMPLETE'}</div><div class="medal" style="margin-top:22px">✦</div><h1>${end?'一次漂亮的远征。':'默契，赢下这一回合。'}</h1><p>${end?'你的伙伴们完成了三轮演示旅程。带着新的想法，再出发一次吧。':'小队赢得了一枚胜利徽记。回到招募站，准备下一次相遇。'}</p><div class="stats"><div class="stat"><label>累计胜场</label><strong>${state.wins} ⚑</strong></div><div class="stat"><label>剩余生命</label><strong>${state.lives} ♥</strong></div><div class="stat"><label>下轮金币</label><strong>10 ◉</strong></div></div><div class="toolbar">${end?button('restart-run','再来一局 ↻'):button('next-round','返回招募站 →')}${button('home','返回营地','secondary')}</div><div class="protocol">演示结算 · 非真实匹配结果 · 正式规则以批准后的产品规格为准</div></section>`}
function start(){state.screen='shop';state.gold=10;state.round=1;state.wins=0;state.lives=5;state.team=[null,null,null,null,null];state.shop=[0,1,2,3,4];state.selected=null;state.frozen=[];render()}
function buy(pos){let idx=state.shop[state.selected?.pos];if(idx===null||idx===undefined)return;if(state.gold<3){toast('金币不足：招募需要 3 金币');return}let target=pos??state.team.indexOf(null);if(target<0||state.team[target]!==null){toast('小队已满，请先送别一位伙伴');return}state.team[target]=idx;state.shop[state.selected.pos]=null;state.frozen=state.frozen.filter(x=>x!==state.selected.pos);state.gold-=3;state.selected={where:'team',pos:target};render();toast(`${animals[idx].name}加入小队 · -3 金币`)}
function tick(){clearTimeout(timer);if(state.screen!=='battle'||state.battleDone)return;timer=setTimeout(()=>{state.event++;if(state.event>=5){state.event=5;state.battleDone=true}render();tick()},1600/state.speed)}
function bind(){document.querySelectorAll('[data-testid]').forEach(el=>el.onclick=()=>{let id=el.dataset.testid;if(id.startsWith('mode-')){state.mode=id.slice(5);state.invite=false;if(state.mode==='practice')start();else{state.screen='lobby';render()}return}if(id==='home'){clearTimeout(timer);state.screen='menu';render();return}if(id==='invite-friend'){state.invite=true;render();toast('演示邀请已接受 · 云间来客加入房间');return}if(id==='start-run'||id==='restart-run'){start();return}let m=id.match(/^(shop|team)-slot-(\d)$/);if(m){let where=m[1],pos=+m[2];if(where==='team'&&state.selected?.where==='shop'&&state.team[pos]===null){buy(pos);return}if(where==='team'&&state.selected?.where==='team'&&state.selected.pos!==pos){let prev=state.selected.pos;[state.team[prev],state.team[pos]]=[state.team[pos],state.team[prev]];state.selected={where,pos};render();toast('站位已交换');return}state.selected={where,pos};render();return}if(id==='buy-selected'){buy();return}if(id==='freeze-selected'){let p=state.selected.pos;state.frozen=state.frozen.includes(p)?state.frozen.filter(x=>x!==p):[...state.frozen,p];render();toast(state.frozen.includes(p)?'已冻结：刷新与下回合保留此伙伴':'已解冻');return}if(id==='sell-selected'){let p=state.selected.pos;state.team[p]=null;state.gold++;state.selected=null;render();toast('伙伴已回到森林 · +1 金币');return}if(id==='roll-shop'){state.gold--;state.shop=state.shop.map((x,i)=>state.frozen.includes(i)?x:(i+state.round+state.gold)%5);state.selected=null;render();toast('招募站已刷新 · -1 金币');return}if(id==='ready-battle'){state.screen='battle';state.event=0;state.battleDone=false;render();tick();return}if(id==='battle-speed'){state.speed=state.speed===1?2:state.speed===2?4:1;render();tick();return}if(id==='skip-battle'){clearTimeout(timer);state.event=5;state.battleDone=true;render();return}if(id==='battle-result'){state.wins++;state.screen='result';render();return}if(id==='next-round'){state.round++;state.gold=10;state.shop=state.shop.map((x,i)=>state.frozen.includes(i)?x:(i+state.round)%5);state.screen='shop';state.selected=null;render()}})}
window.__prototype={snapshot:()=>JSON.parse(JSON.stringify(state))};render();
</script></html>
