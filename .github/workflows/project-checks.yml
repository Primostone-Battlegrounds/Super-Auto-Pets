name: Project verification

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  checks:
    name: Project checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install Lua and Backlog
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 lua5.3
          npm install --prefix "$RUNNER_TEMP/backlog-tools" --no-audit --no-fund backlog.md@1.53.0
          echo "$RUNNER_TEMP/backlog-tools/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Check project
        env:
          LUA: lua5.4
        run: sh scripts/check.sh
      - name: Check domain compatibility on Lua 5.3
        run: |
          for suite in tests/*.lua; do
            lua5.3 -E "$suite"
          done
      - name: Prepare pinned Miliastra MCP
        if: hashFiles('tests/native/verify-g0.mjs', 'tests/native/verify-m1.mjs', 'tests/native/verify-m2-probe.mjs', 'tests/native/verify-m3-probe.mjs') != ''
        run: sh platform/setup-tools.sh "$RUNNER_TEMP/miliastra-mcp"
      - name: Verify G0 native GIL roundtrip
        if: hashFiles('tests/native/verify-g0.mjs') != ''
        env:
          MILIASTRA_ALLOW_LIVE_WRITE: '0'
        run: node tests/native/verify-g0.mjs "$RUNNER_TEMP/miliastra-mcp" "$RUNNER_TEMP/native-validation" lua5.3
      - name: Verify M1 native GIL and simulated run
        if: hashFiles('tests/native/verify-m1.mjs') != ''
        env:
          MILIASTRA_ALLOW_LIVE_WRITE: '0'
        run: |
          node tests/native/verify-m1.mjs "$RUNNER_TEMP/miliastra-mcp" \
            "$RUNNER_TEMP/native-validation" lua5.3 "$RUNNER_TEMP/m1-device-candidate"
          cd "$RUNNER_TEMP/m1-device-candidate"
          sha256sum -c SHA256SUMS
      - name: Upload verified device candidate
        if: hashFiles('tests/native/verify-m1.mjs') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m1-device-candidate-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/m1-device-candidate
          if-no-files-found: error
          retention-days: 30
      - name: Verify the isolated two-player sync probe
        if: hashFiles('tests/native/verify-m2-probe.mjs') != ''
        env:
          MILIASTRA_ALLOW_LIVE_WRITE: '0'
        run: |
          node tests/native/verify-m2-probe.mjs "$RUNNER_TEMP/miliastra-mcp" \
            "$RUNNER_TEMP/native-validation" lua5.3 "$RUNNER_TEMP/m2-duel-probe"
          cd "$RUNNER_TEMP/m2-duel-probe"
          sha256sum -c SHA256SUMS
      - name: Upload verified two-player probe
        if: hashFiles('tests/native/verify-m2-probe.mjs') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m2-duel-probe-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/m2-duel-probe
          if-no-files-found: error
          retention-days: 30
      - name: Verify the isolated eight-seat platform probe
        if: hashFiles('tests/native/verify-m3-probe.mjs') != ''
        env:
          MILIASTRA_ALLOW_LIVE_WRITE: '0'
        run: |
          node tests/native/verify-m3-probe.mjs "$RUNNER_TEMP/miliastra-mcp" \
            "$RUNNER_TEMP/native-validation" lua5.3 "$RUNNER_TEMP/m3-eight-seat-probe"
          cd "$RUNNER_TEMP/m3-eight-seat-probe"
          sha256sum -c SHA256SUMS
      - name: Upload verified eight-seat platform probe
        if: hashFiles('tests/native/verify-m3-probe.mjs') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m3-eight-seat-probe-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/m3-eight-seat-probe
          if-no-files-found: error
          retention-days: 30
