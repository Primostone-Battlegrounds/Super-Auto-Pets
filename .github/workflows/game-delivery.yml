name: Game delivery
run-name: Game delivery · ${{ github.event.pull_request.head.sha || github.sha }}

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
    paths:
      - .github/workflows/game-delivery.yml
      - scripts/verify-delivery.mjs
      - scripts/simulator-verify.mjs
      - platform/product-release.json
      - scripts/product-release.mjs
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: game-delivery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build and deliver game
    if: >-
      github.repository == 'Primostone-Battlegrounds/Super-Auto-Pets' &&
      (github.ref == 'refs/heads/develop' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install rules and renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 lua5.3 fonts-noto-cjk
          npm install --prefix "$RUNNER_TEMP/backlog" --no-audit --no-fund backlog.md@1.53.0
          printf '%s\n' "$RUNNER_TEMP/backlog/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Prepare pinned Miliastra MCP
        run: sh platform/setup-tools.sh "$RUNNER_TEMP/miliastra-mcp"
      - name: Verify Active implementation before delivery
        run: node scripts/check-design.mjs active-implementation
      - name: Verify both Lua rule runtimes
        shell: bash
        run: sh scripts/check-rules.sh | tee "$RUNNER_TEMP/sap-rules.log"
      - name: Prepare pinned Beyond Simulator
        run: sh scripts/simulator-setup.sh "$RUNNER_TEMP/beyond-simulator" "$RUNNER_TEMP/simulator-setup"
      - name: Build and verify the game package
        id: build
        env:
          MILIASTRA_ALLOW_LIVE_WRITE: '0'
          SIMULATOR_REQUIRE_TEXT: '1'
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          package="$RUNNER_TEMP/game-package"
          node tests/native/verify-game.mjs "$RUNNER_TEMP/miliastra-mcp" "$RUNNER_TEMP/game-validation" lua5.3 "$package"
          node scripts/check-design.mjs delivery "$package"
          node scripts/simulator-verify.mjs "$RUNNER_TEMP/miliastra-mcp" "$RUNNER_TEMP/beyond-simulator" \
            "$package/super-auto-pets.gil" "$RUNNER_TEMP/simulator-evidence"
          node scripts/record-acceptance.mjs "$package" "$RUNNER_TEMP/sap-rules.log" "$RUNNER_TEMP/simulator-evidence"
          gate=$(node scripts/acceptance-gate.mjs "$package")
          verdict=$(node -p 'JSON.parse(process.argv[1]).verdict' "$gate")
          (cd "$package" && sha256sum --strict -c SHA256SUMS)
          printf 'evidence=game-evidence-%s\n' "${SOURCE_SHA:0:12}" >> "$GITHUB_OUTPUT"
          printf 'verdict=%s\n' "$verdict" >> "$GITHUB_OUTPUT"
      - name: Upload the verified GIL as a single file
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # An unarchived upload uses the filename. Give overwrite the same name.
          name: super-auto-pets.gil
          path: ${{ runner.temp }}/game-package/super-auto-pets.gil
          archive: false
          if-no-files-found: error
          retention-days: 30
          overwrite: true
      - name: Download the exact GIL from GitHub
        id: download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_WEB_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          download="$RUNNER_TEMP/game-download"
          api_url="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip"
          mkdir -p "$download"
          # The download endpoint retains /zip in its path and serves the uploaded raw bytes.
          # A new artifact can take a short time to become visible.
          fetch_artifact() {
            local delay status
            for delay in 0 1 2 4 8 16; do
              sleep "$delay"
              if status=$(curl --silent --show-error --location --proto '=https' --proto-redir '=https' \
                  --connect-timeout 10 --max-time 30 --output "$download/artifact.partial" --write-out '%{http_code}' \
                  --header 'X-GitHub-Api-Version: 2022-11-28' "$@" "$api_url"); then
                case "$status" in
                  200) mv "$download/artifact.partial" "$download/super-auto-pets.gil"; return $? ;;
                  404|408|429|5??) printf 'Artifact download returned HTTP %s.\n' "$status" ;;
                  *) printf 'Artifact download failed with HTTP %s.\n' "$status"; return 1 ;;
                esac
              fi
            done
            return 1
          }
          if fetch_artifact; then
            printf 'url=%s\nrequires_login=false\n' "$api_url" >> "$GITHUB_OUTPUT"
            printf 'Downloaded the artifact anonymously.\n'
          elif fetch_artifact --header "Authorization: Bearer $GH_TOKEN"; then
            printf 'url=%s\nrequires_login=true\n' "$ARTIFACT_WEB_URL" >> "$GITHUB_OUTPUT"
            printf 'Downloaded the artifact with GitHub authentication.\n'
          else
            printf '::error::Artifact download did not succeed within the retry limit.\n'
            exit 1
          fi
      - name: Verify the downloaded GIL
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
        run: |
          package="$RUNNER_TEMP/game-package"
          gil="$RUNNER_TEMP/game-download/super-auto-pets.gil"
          node scripts/verify-delivery.mjs "$RUNNER_TEMP/miliastra-mcp" "$gil" "$package/BUILD.json" \
            "$ARTIFACT_ID" "$ARTIFACT_DIGEST" > "$RUNNER_TEMP/download-receipt.json"
          mv "$RUNNER_TEMP/download-receipt.json" "$package/DOWNLOAD.json"
          (cd "$package" && sha256sum DOWNLOAD.json >> SHA256SUMS)
      - name: Upload engineering evidence
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.build.outputs.evidence }}
          path: |
            ${{ runner.temp }}/game-package
            !${{ runner.temp }}/game-package/super-auto-pets.gil
          if-no-files-found: error
          retention-days: 30
          overwrite: true
      - name: Link the game download
        if: github.ref == 'refs/heads/develop'
        env:
          ARTIFACT_URL: ${{ steps.download.outputs.url }}
          ARTIFACT_REQUIRES_LOGIN: ${{ steps.download.outputs.requires_login }}
          EVIDENCE_NAME: ${{ steps.build.outputs.evidence }}
          ACCEPTANCE_VERDICT: ${{ steps.build.outputs.verdict }}
        run: |
          test -n "$ARTIFACT_URL"
          {
            printf '## 小动物自走棋 · 千星隔离候选\n\n'
            printf '[下载 super-auto-pets.gil](%s)\n\n' "$ARTIFACT_URL"
            if [ "$ARTIFACT_REQUIRES_LOGIN" = true ]; then
              printf '此链接需要登录 GitHub。\n\n'
            else
              printf '此下载无需登录 GitHub。\n\n'
            fi
            printf '下载后将 GIL 导入获授权的隔离存档。产物保留 30 天。\n\n'
            printf 'Git SHA `%s`\n\n' "$SOURCE_SHA"
            printf '成品验收 `%s`。各层状态、校验和及夹具许可见工程证据 `%s`。\n' \
              "$ACCEPTANCE_VERDICT" "$EVIDENCE_NAME"
          } >> "$GITHUB_STEP_SUMMARY"
